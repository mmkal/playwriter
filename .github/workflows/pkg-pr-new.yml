name: Publish Preview

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build extension
        run: pnpm --filter mcp-extension build

      - name: Build playwriter
        run: pnpm --filter playwriter build

      - name: Publish to pkg.pr.new
        run: pnpm dlx pkg-pr-new publish --bin './playwriter'
